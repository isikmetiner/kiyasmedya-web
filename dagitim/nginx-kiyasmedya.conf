# kiyasmedya.com — kurumsal site ve 922'nin gizlilik / hesap silme sayfaları.
# 922 API'siyle aynı sunucuda (92.205.19.254), yalnızca durağan dosya.
#
#   sudo cp dagitim/nginx-kiyasmedya.conf /etc/nginx/sites-available/kiyasmedya
#   sudo ln -s /etc/nginx/sites-available/kiyasmedya /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sertifika certbot'un nginx eklentisiyle DEĞİL, webroot ile alınır; bu dosya
# elle yazılmış haliyle kalır, certbot ona dokunmaz:
#
#   sudo certbot certonly --webroot -w /var/www/letsencrypt \
#     --cert-name kiyasmedya.com -d kiyasmedya.com -d www.kiyasmedya.com \
#     --deploy-hook "systemctl reload nginx"
#
# Doğrulama klasörü site klasöründen ayrı: yayinla.sh site klasörünü her
# yayında baştan kurduğu için orada tutulamazdı.

# http: doğrulama istekleri dışında her şey https://kiyasmedya.com'a.
server {
    listen 80;
    listen [::]:80;
    server_name kiyasmedya.com www.kiyasmedya.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://kiyasmedya.com$request_uri;
    }
}

# https://www -> https://kiyasmedya.com.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kiyasmedya.com;

    ssl_certificate /etc/letsencrypt/live/kiyasmedya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiyasmedya.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://kiyasmedya.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kiyasmedya.com;

    ssl_certificate /etc/letsencrypt/live/kiyasmedya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiyasmedya.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/kiyasmedya-web;
    index index.html;

    # /922/gizlilik -> /922/gizlilik/ yönlendirmesi göreli olsun.
    absolute_redirect off;

    # Tek sayfalık uygulama değil: /922/... sayfaları ayrı index.html'ler.
    # Bilinmeyen yol 404 döner.
    location / {
        try_files $uri $uri/ =404;
    }

    # Hash'li varlıklar sonsuza kadar önbelleklenebilir; HTML'ler kısa.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }
}

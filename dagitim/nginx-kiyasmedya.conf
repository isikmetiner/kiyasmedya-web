# kiyasmedya.com — kurumsal site ve 922'nin gizlilik / hesap silme sayfaları.
# 922 API'siyle aynı sunucuda (92.205.19.254), yalnızca durağan dosya.
#
#   sudo cp dagitim/nginx-kiyasmedya.conf /etc/nginx/sites-available/kiyasmedya
#   sudo ln -s /etc/nginx/sites-available/kiyasmedya /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kiyasmedya.com -d www.kiyasmedya.com --redirect
#
# TLS satırlarını certbot kendisi ekler; bu dosya o yüzden yalnızca 80'i
# dinler. www -> kök yönlendirmesi sertifika alındıktan SONRA açılır
# (aşağıdaki yorumlu blok): önce açılırsa www'nin doğrulama isteği henüz
# sertifikası olmayan https adresine yönlenir ve certbot başarısız olur.

server {
    server_name kiyasmedya.com www.kiyasmedya.com;

    root /var/www/kiyasmedya-web;
    index index.html;

    # Sertifikadan sonra açılacak:
    # if ($host = www.kiyasmedya.com) {
    #     return 301 https://kiyasmedya.com$request_uri;
    # }

    # /922/gizlilik -> /922/gizlilik/ yönlendirmesi göreli olsun; mutlak
    # olunca nginx kendi şemasını (http) yazabiliyor.
    absolute_redirect off;

    # Tek sayfalık uygulama değil: /922/... sayfaları ayrı index.html'ler.
    # Bilinmeyen yol 404 döner (GitHub Pages'teki gibi).
    location / {
        try_files $uri $uri/ =404;
    }

    # Hash'li varlıklar sonsuza kadar önbelleklenebilir; HTML'ler kısa.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }

    listen 80;
    listen [::]:80;
}
